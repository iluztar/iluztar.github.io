# Keeps data/instagram.json in sync with the real @iluztar profile counts.
# The page (index.html) reads that JSON; the Instagram token stays in repository secrets.
#
# Secrets (Settings → Secrets and variables → Actions):
#   IG_ACCESS_TOKEN  required  long-lived Instagram User access token (Instagram API with Instagram Login)
#   GH_SECRETS_PAT   optional  fine-grained PAT for this repo with "Secrets: Read and write";
#                              lets the weekly job refresh IG_ACCESS_TOKEN before its 60-day expiry
name: Instagram stats

on:
  schedule:
    - cron: '17 */6 * * *'   # counts, every 6 hours
    - cron: '43 2 * * 1'     # token refresh, Mondays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch profile counts
        env:
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${IG_TOKEN}" ]; then
            echo "::error::Secret IG_ACCESS_TOKEN is not set."
            exit 1
          fi
          curl -sS --fail-with-body -G "https://graph.instagram.com/me" \
            --data-urlencode "fields=username,media_count,followers_count,follows_count" \
            --data-urlencode "access_token=${IG_TOKEN}" -o raw.json || { cat raw.json; exit 1; }
          jq -e '(.followers_count|numbers) and (.follows_count|numbers) and (.media_count|numbers)' raw.json > /dev/null \
            || { echo "::error::Unexpected API response"; cat raw.json; exit 1; }
          jq '{username, posts: .media_count, followers: .followers_count, following: .follows_count}' raw.json > new.json
          rm raw.json

      - name: Commit if counts changed
        run: |
          set -euo pipefail
          old=$(jq -c '{username, posts, followers, following}' data/instagram.json 2>/dev/null || echo '{}')
          new=$(jq -c '.' new.json)
          if [ "$old" = "$new" ]; then
            echo "No change: $new"
            rm new.json
            exit 0
          fi
          jq --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '. + {updated_at: $t}' new.json > data/instagram.json
          rm new.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instagram.json
          git commit -m "Update Instagram stats"
          git push

  refresh-token:
    # long-lived tokens last 60 days; refreshing weekly keeps them alive indefinitely
    if: github.event.schedule == '43 2 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Refresh IG_ACCESS_TOKEN
        env:
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::GH_SECRETS_PAT is not set; refresh IG_ACCESS_TOKEN by hand before it expires (60 days)."
            exit 0
          fi
          curl -sS --fail-with-body -G "https://graph.instagram.com/refresh_access_token" \
            --data-urlencode "grant_type=ig_refresh_token" \
            --data-urlencode "access_token=${IG_TOKEN}" -o r.json || { jq 'del(.access_token)' r.json || true; exit 1; }
          NEW=$(jq -r '.access_token // empty' r.json)
          rm r.json
          if [ -z "$NEW" ]; then echo "::error::No token in refresh response"; exit 1; fi
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --repo "$REPO" --body "$NEW"
          echo "Token refreshed."
